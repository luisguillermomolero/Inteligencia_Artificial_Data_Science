<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CV WebApp - Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; color:#111; }
    .card { max-width: 720px; padding: 20px; border: 1px solid #eee; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    h1 { margin: 0 0 16px; font-size: 28px; }
    .row { display:flex; gap:16px; align-items:center; margin-bottom: 12px; }
    .btn { padding: 8px 14px; border: 1px solid #ddd; border-radius: 8px; background:#111; color:#fff; cursor:pointer; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    img { max-width: 360px; display:block; border-radius:8px; }
    .muted { color:#666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sube una imagen</h1>
    <div class="row">
      <input id="fileInput" type="file" accept="image/*" />
      <button id="sendBtn" class="btn" disabled>Analizar</button>
    </div>
    <div id="preview" class="row"></div>
    <p id="result" class="muted"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
